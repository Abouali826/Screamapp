<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff4d4d; font-size: 2.5rem; text-shadow: 0 0 10px rgba(255, 77, 77, 0.5); margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 25px; }
        
        /* تنسيق مكان زر الربط */
        #ton-connect-button {
            margin-bottom: 25px;
        }

        textarea {
            width: 90%;
            max-width: 450px;
            height: 150px;
            background: #1a1a1a;
            border: 2px solid #333;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            resize: none;
            outline: none;
            margin-bottom: 20px;
        }

        button#payBtn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #0088cc, #005588);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
            display: none; /* يختفي حتى يتم ربط المحفظة */
        }
        .price { margin-top: 10px; color: #00d1ff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🗣️ Scream</h1>
    <p>فرغ طاقتك السلبية.. سرية تامة وهويّة مجهولة.</p>

    <div id="ton-connect-button"></div>

    <textarea id="ventInput" placeholder="اكتب ما بداخلك هنا..."></textarea>

    <button id="payBtn" onclick="sendTransaction()">أرسل الصرخة (0.2 TON)</button>
    <div class="price">التكلفة: 0.2 TON</div>

    <script>
        // إعداد واجهة TON Connect
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // مراقبة حالة المحفظة: إذا اتصلت، أظهر زر الدفع
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                document.getElementById('payBtn').style.display = 'block';
                document.getElementById('ventInput').placeholder = "المحفظة متصلة.. اكتب الآن";
            } else {
                document.getElementById('payBtn').style.display = 'none';
            }
        });

        async function sendTransaction() {
            const message = document.getElementById('ventInput').value;
            if (!message) {
                alert("اكتب شيئاً أولاً!");
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [
                    {
                        address: "UQANtRoXP8-c5QC4Mhib-BGqJs4TJdt7Q3CFD2e-s4fKfABc", // عنوان محفظتك
                        amount: "200000000", // 0.2 TON
                    }
                ]
            };

            try {
                await tonConnectUI.sendTransaction(transaction);
                alert("تم إرسال صرختك بنجاح وتفريغ طاقتك!");
                document.getElementById('ventInput').value = "";
            } catch (e) {
                alert("فشلت العملية أو تم إلغاؤها.");
            }
        }
    </script>
</body>
</html>
