<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream App - MultiChain</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #ff4d4d; font-size: 2rem; margin-bottom: 5px; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 20px; }
        
        .payment-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
        }

        #ton-connect-button { margin: 15px auto; }

        .bnb-section {
            border-top: 1px solid #333;
            margin-top: 15px;
            padding-top: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .bnb-btn { background: #F3BA2F; color: #000; } /* لون BNB الرسمي */
        .pay-btn { background: #0088cc; color: white; display: none; }
        
        textarea {
            width: 100%;
            height: 100px;
            background: #0b0b0b;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>🗣️ Scream</h1>
    <p>فرغ طاقتك السلبية عبر TON أو BNB</p>

    <div class="payment-box">
        <textarea id="ventInput" placeholder="اكتب ما بداخلك هنا..."></textarea>

        <div id="ton-connect-button"></div>
        <button id="payTonBtn" class="pay-btn" onclick="sendTon()">إرسال عبر TON (0.2 TON)</button>

        <div class="bnb-section">
            <button id="bnbConnectBtn" class="bnb-btn" onclick="connectBNB()">ربط محفظة BNB (MetaMask)</button>
            <button id="payBnbBtn" class="bnb-btn" style="display:none;" onclick="sendBNB()">إرسال عبر BNB (0.005 BNB)</button>
        </div>
    </div>

    <script>
        // --- إعدادات TON ---
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        tonConnectUI.onStatusChange(wallet => {
            document.getElementById('payTonBtn').style.display = wallet ? 'block' : 'none';
        });

        async function sendTon() {
            const msg = document.getElementById('ventInput').value;
            if(!msg) return alert("اكتب شيئاً!");
            try {
                await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [{ address: "UQANtRoXP8-c5QC4Mhib-BGqJs4TJdt7Q3CFD2e-s4fKfABc", amount: "200000000" }]
                });
                alert("تم الإرسال بنجاح!");
            } catch(e) { alert("فشلت العملية"); }
        }

        // --- إعدادات BNB ---
        let bnbAccount;
        async function connectBNB() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    bnbAccount = accounts[0];
                    document.getElementById('bnbConnectBtn').style.display = 'none';
                    document.getElementById('payBnbBtn').style.display = 'block';
                    alert("متصل بـ BNB: " + bnbAccount.substring(0,6) + "...");
                } catch (err) { alert("فشل الاتصال"); }
            } else { alert("يرجى فتح الموقع من متصفح يدعم MetaMask أو Trust Wallet"); }
        }

        async function sendBNB() {
            const msg = document.getElementById('ventInput').value;
            if(!msg) return alert("اكتب شيئاً!");
            
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            
            try {
                const tx = await signer.sendTransaction({
                    to: "0x895697621183311E6A1B6a4220b33036F9dE3a00", // ضع عنوان محفظة BNB الخاصة بك هنا
                    value: ethers.utils.parseEther("0.005") // القيمة بالـ BNB (حوالي 3 دولار)
                });
                await tx.wait();
                alert("تم إرسال الصرخة عبر BNB!");
            } catch (e) { alert("فشلت عملية الدفع"); }
        }
    </script>
</body>
</html>
