<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream App - فرغ طاقتك</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .language-picker { position: absolute; top: 20px; left: 20px; }
        select { background: #222; color: white; border: 1px solid #444; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        h1 { color: #ff4d4d; margin-bottom: 10px; font-size: 2.5rem; text-shadow: 0 0 10px rgba(255, 77, 77, 0.5); }
        p { font-size: 1rem; color: #aaa; margin-bottom: 20px; text-align: center; }
        
        textarea {
            width: 95%;
            max-width: 500px;
            height: 180px;
            background: #1a1a1a;
            border: 2px solid #333;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #0088cc; }
        
        #ton-connect-button { margin-bottom: 20px; }

        button#sendBtn {
            margin-top: 20px;
            padding: 15px 50px;
            background: linear-gradient(135deg, #0088cc, #005588);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .price-tag { margin-top: 15px; font-weight: bold; color: #00d1ff; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="language-picker">
        <select id="langSelect" onchange="changeLanguage()">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
        </select>
    </div>

    <h1 id="mainTitle">Scream 🗣️</h1>
    <p id="subTitle">فرغ طاقتك السلبية.. سرية تامة وهوية مجهولة.</p>

    <div id="ton-connect-button"></div>

    <textarea id="ventInput" placeholder="اكتب غضبك هنا..."></textarea>

    <button id="sendBtn" onclick="sendTransaction()">اربط المحفظة وفرغ طاقتك</button>

    <div class="price-tag" id="priceLabel">Cost: 0.2 TON</div>

    <script>
        // إعداد TON Connect UI
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        async function sendTransaction() {
            const text = document.getElementById('ventInput').value;
            
            if (!text) {
                alert("يرجى كتابة شيء أولاً / Please write something first");
                return;
            }

            if (!tonConnectUI.connected) {
                alert("يرجى ربط محفظتك أولاً عبر الزر في الأعلى / Please connect your wallet first");
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300, // 5 دقائق صلاحية
                messages: [
                    {
                        address: "UQANtRoXP8-c5QC4Mhib-BGqJs4TJdt7Q3CFD2e-s4fKfABc", // محفظتك الشخصية
                        amount: "200000000", // 0.2 TON بالنانوتون
                    }
                ]
            };

            try {
                const result = await tonConnectUI.sendTransaction(transaction);
                alert("تمت العملية بنجاح! تم تفريغ طاقتك.");
                document.getElementById('ventInput').value = ""; // مسح النص
            } catch (e) {
                console.error(e);
                alert("تم إلغاء العملية أو حدث خطأ في الدفع.");
            }
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const translations = {
                ar: { title: "Scream 🗣️", sub: "فرغ طاقتك السلبية.. سرية تامة وهوية مجهولة.", placeholder: "اكتب غضبك هنا...", btn: "اربط المحفظة وفرغ طاقتك", price: "التكلفة: 0.2 TON" },
                en: { title: "Scream 🗣️", sub: "Vent your negative energy.. total anonymity.", placeholder: "Write your anger here...", btn: "Connect Wallet & Vent", price: "Cost: 0.2 TON" },
                ru: { title: "Scream 🗣️", sub: "Выплесните негатив.. полная анонимность.", placeholder: "Напишите здесь...", btn: "Подключить и отправить", price: "Цена: 0.2 TON" }
            };
            
            document.getElementById('mainTitle').innerText = translations[lang].title;
            document.getElementById('subTitle').innerText = translations[lang].sub;
            document.getElementById('ventInput').placeholder = translations[lang].placeholder;
            document.getElementById('sendBtn').innerText = translations[lang].btn;
            document.getElementById('priceLabel').innerText = translations[lang].price;
            document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        }
    </script>
</body>
</html>
