<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream App</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .language-picker { position: absolute; top: 20px; right: 20px; }
        select { background: #222; color: white; border: 1px solid #444; padding: 8px; border-radius: 8px; cursor: pointer; }
        
        h1 { color: #ff4d4d; font-size: 2.5rem; text-shadow: 0 0 10px rgba(255, 77, 77, 0.5); margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 25px; max-width: 300px; }
        
        #ton-connect-button { margin-bottom: 25px; }

        textarea {
            width: 90%;
            max-width: 450px;
            height: 150px;
            background: #1a1a1a;
            border: 2px solid #333;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            text-align: right;
        }

        button#payBtn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #0088cc, #005588);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
            display: none; /* يظهر فقط بعد الربط */
        }
        .price { margin-top: 10px; color: #00d1ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="language-picker">
        <select id="langSelect" onchange="changeLanguage()">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
        </select>
    </div>

    <h1 id="mainTitle">🗣️ Scream</h1>
    <p id="subTitle">فرغ طاقتك السلبية.. سرية تامة وهويّة مجهولة.</p>

    <div id="ton-connect-button"></div>

    <textarea id="ventInput" placeholder="اكتب ما بداخلك هنا..."></textarea>

    <button id="payBtn" onclick="sendTransaction()">أرسل الصرخة (0.2 TON)</button>
    <div class="price" id="priceLabel">التكلفة: 0.2 TON</div>

    <script>
        // إعداد TON Connect
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // مراقبة حالة المحفظة
        tonConnectUI.onStatusChange(wallet => {
            const payBtn = document.getElementById('payBtn');
            if (wallet) {
                payBtn.style.display = 'block';
            } else {
                payBtn.style.display = 'none';
            }
        });

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const ventInput = document.getElementById('ventInput');
            const translations = {
                ar: { title: "🗣️ Scream", sub: "فرغ طاقتك السلبية.. سرية تامة وهويّة مجهولة.", placeholder: "اكتب ما بداخلك هنا...", btn: "أرسل الصرخة (0.2 TON)", price: "التكلفة: 0.2 TON", dir: "rtl" },
                en: { title: "🗣️ Scream", sub: "Vent your negative energy.. total anonymity.", placeholder: "Write your anger here...", btn: "Send Scream (0.2 TON)", price: "Cost: 0.2 TON", dir: "ltr" },
                ru: { title: "🗣️ Scream", sub: "Выплесните негатив.. полная анонимность.", placeholder: "Напишите здесь...", btn: "Отправить (0.2 TON)", price: "Цена: 0.2 TON", dir: "ltr" }
            };
            
            const t = translations[lang];
            document.getElementById('mainTitle').innerText = t.title;
            document.getElementById('subTitle').innerText = t.sub;
            ventInput.placeholder = t.placeholder;
            document.getElementById('payBtn').innerText = t.btn;
            document.getElementById('priceLabel').innerText = t.price;
            document.body.dir = t.dir;
            ventInput.style.textAlign = (t.dir === 'rtl' ? 'right' : 'left');
        }

        async function sendTransaction() {
            const message = document.getElementById('ventInput').value;
            if (!message) {
                alert(document.dir === 'rtl' ? "اكتب شيئاً أولاً!" : "Please write something first!");
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 360,
                messages: [{
                    address: "UQANtRoXP8-c5QC4Mhib-BGqJs4TJdt7Q3CFD2e-s4fKfABc",
                    amount: "200000000",
                }]
            };

            try {
                await tonConnectUI.sendTransaction(transaction);
                alert(document.dir === 'rtl' ? "تم إرسال صرختك بنجاح!" : "Scream sent successfully!");
                document.getElementById('ventInput').value = "";
            } catch (e) {
                alert(document.dir === 'rtl' ? "فشلت العملية أو تم إلغاؤها." : "Transaction failed or cancelled.");
            }
        }
    </script>
</body>
</html>
