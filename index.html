<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream App - MultiChain</title>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .payment-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ff4d4d; margin-bottom: 5px; }
        textarea {
            width: 100%;
            height: 120px;
            background: #0b0b0b;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
            transition: 0.3s;
        }
        .bnb-btn { background: #F3BA2F; color: #000; }
        .bnb-btn:hover { background: #dba82a; }
        .pay-ton { background: #0088cc; color: white; display: none; }
        #ton-connect-button { margin: 10px auto; }
        .divider { margin: 20px 0; border-top: 1px solid #333; position: relative; }
        .divider span { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #1a1a1a; padding: 0 10px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

    <h1>🗣️ Scream</h1>
    <p>فرغ طاقتك السلبية.. هوية مجهولة تماماً.</p>

    <div class="payment-box">
        <textarea id="ventInput" placeholder="اكتب ما يزعجك هنا..."></textarea>

        <div id="ton-connect-button"></div>
        <button id="payTonBtn" class="pay-ton" onclick="sendTon()">أرسل عبر TON (0.2 TON)</button>

        <div class="divider"><span>أو استخدم شبكة BNB</span></div>

        <button id="bnbConnectBtn" class="bnb-btn" onclick="connectBNB()">ربط محفظة BNB (Smart Chain)</button>
        <button id="payBnbBtn" class="bnb-btn" style="display:none;" onclick="sendBNB()">تأكيد الدفع (0.005 BNB)</button>
    </div>

    <script>
        // إعدادات TON
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        tonConnectUI.onStatusChange(wallet => {
            document.getElementById('payTonBtn').style.display = wallet ? 'block' : 'none';
        });

        async function sendTon() {
            const msg = document.getElementById('ventInput').value;
            if(!msg) return alert("يرجى الكتابة أولاً");
            try {
                await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 600,
                    messages: [{ address: "UQANtRoXP8-c5QC4Mhib-BGqJs4TJdt7Q3CFD2e-s4fKfABc", amount: "200000000" }]
                });
                alert("تمت العملية بنجاح!");
            } catch(e) { alert("فشلت عملية TON"); }
        }

        // إعدادات BNB - تم تحديث العنوان
        let bnbAccount;
        const myBnbAddress = "0x895697621183311E6A1B6a4220b33036F9dE3a00";

        async function connectBNB() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    bnbAccount = accounts[0];
                    document.getElementById('bnbConnectBtn').style.display = 'none';
                    document.getElementById('payBnbBtn').style.display = 'block';
                } catch (err) { alert("رفض المستخدم الاتصال"); }
            } else {
                alert("يرجى فتح الموقع من متصفح محفظة Trust Wallet أو MetaMask");
            }
        }

        async function sendBNB() {
            const msg = document.getElementById('ventInput').value;
            if(!msg) return alert("اكتب رسالتك أولاً");
            
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const tx = await signer.sendTransaction({
                    to: myBnbAddress,
                    value: ethers.utils.parseEther("0.005")
                });
                alert("جاري المعالجة... انتظر لحظة");
                await tx.wait();
                alert("تم الدفع بنجاح عبر BNB!");
            } catch (e) { alert("فشل الدفع، تأكد من وجود رصيد وكفاية رسوم الغاز"); }
        }
    </script>
</body>
</html>
