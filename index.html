<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scream - فرغ طاقتك</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        /* قائمة اللغات */
        .language-picker {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        select {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        h1 { color: #ff4d4d; margin-bottom: 10px; font-size: 2.5rem; }
        p { font-size: 1rem; color: #aaa; margin-bottom: 20px; text-align: center; }
        
        textarea {
            width: 90%;
            max-width: 500px;
            height: 180px;
            background: #1a1a1a;
            border: 2px solid #333;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #0088cc; }
        
        button {
            margin-top: 25px;
            padding: 15px 40px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        button:hover { background-color: #0077b5; transform: translateY(-2px); }
        .price-tag { margin-top: 15px; font-weight: bold; color: #00d1ff; }
    </style>
</head>
<body>

    <div class="language-picker">
        <select id="langSelect" onchange="changeLanguage()">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="zh">中文 (Chinese)</option>
            <option value="ja">日本語 (Japanese)</option>
            <option value="ru">Русский (Russian)</option>
        </select>
    </div>

    <h1 id="mainTitle">Scream 🗣️</h1>
    <p id="subTitle">فرغ كل ما في قلبك.. سرية تامة وهوية مجهولة.</p>

    <textarea id="ventInput" placeholder="اكتب غضبك هنا..."></textarea>

    <button id="btnText" onclick="payAndSend()">اربط المحفظة وفرغ طاقتك</button>

    <div class="price-tag">Cost: 0.2 TON</div>

    <script>
        const translations = {
            ar: { title: "Scream 🗣️", sub: "فرغ كل ما في قلبك.. سرية تامة وهوية مجهولة.", placeholder: "اكتب غضبك هنا...", btn: "اربط المحفظة وفرغ طاقتك" },
            en: { title: "Scream 🗣️", sub: "Vent everything in your heart.. total anonymity.", placeholder: "Write your anger here...", btn: "Connect Wallet & Vent" },
            fr: { title: "Scream 🗣️", sub: "Libérez votre cœur.. anonymat total.", placeholder: "Écrivez votre colère ici...", btn: "Connecter le Wallet" },
            zh: { title: "Scream 🗣️", sub: "释放你心中的一切.. 完全匿名。", placeholder: "在这里写下你的愤怒...", btn: "连接钱包并释放" },
            ja: { title: "Scream 🗣️", sub: "心のすべてを吐き出せ.. 完全な匿名性。", placeholder: "ここに怒りを書いてください...", btn: "ウォレットを接続して発散" },
            ru: { title: "Scream 🗣️", sub: "Выплесните все, что на сердце.. полная анонимность.", placeholder: "Напишите здесь свой гнев...", btn: "Подключить кошелек" }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('mainTitle').innerText = translations[lang].title;
            document.getElementById('subTitle').innerText = translations[lang].sub;
            document.getElementById('ventInput').placeholder = translations[lang].placeholder;
            document.getElementById('btnText').innerText = translations[lang].btn;
            
            // تغيير اتجاه النص للعربية فقط
            document.body.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        }

        function payAndSend() {
            const text = document.getElementById('ventInput').value;
            if(!text) {
                alert("Please write something first! / يرجى كتابة شيء أولاً!");
                return;
            }
            alert("Proceeding to TON Wallet to pay 0.2 TON...");
        }
    </script>

</body>
</html>
